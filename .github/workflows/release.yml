name: Release

# Release Please watches master, keeps a release pull request up to date from the conventional
# commit titles that land here, and cuts the release when that pull request is merged. Tagging by
# hand is gone: the two times it was done in this project's first day of being public, the tag was
# forgotten both times and the release simply did not happen.
on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write
  packages: write
  # For the comment and the autorelease labels release-please writes on the release pull request
  # once it has cut the release. Those are issue endpoints even when the subject is a pull
  # request, and them failing is not cosmetic: the label is how release-please knows the pull
  # request is done with, so a failure there leaves it `autorelease: pending` and every later run
  # tries to release it again. That is what happened to 1.15.0.
  issues: write

# Not cancel-in-progress: killing a publish partway through, after amd64 pushed and before arm64
# does, is worse than making the second run wait for the first.
concurrency:
  group: ${{ github.workflow }}

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.rp.outputs.release_created }}
      version: ${{ steps.rp.outputs.version }}
      tag: ${{ steps.rp.outputs.tag_name }}
      # The release is cut as a draft and published at the end of `publish`, and this is what
      # names it there. The id rather than the tag: `repos/.../releases/tags/{tag}` does not
      # return drafts, so anything that looks a release up by tag finds nothing until after the
      # step that needed it has run.
      release_id: ${{ steps.rp.outputs.id }}
    steps:
      # release-please is invoked twice, once per half of what it does, because the two halves
      # want different tokens and the single invocation could only have one.
      #
      # Cutting the release needs a token that can create a git ref, since `force-tag-creation`
      # creates the tag itself rather than letting GitHub create it when the draft is published.
      # The PAT could not: the first run after drafting landed died on
      # `Resource not accessible by personal access token` against
      # `https://docs.github.com/rest/git/refs#create-a-reference`, with no release cut. The
      # workflow's own GITHUB_TOKEN can, under the `contents: write` declared above, and its
      # permissions are visible in this file rather than in a secret nobody can read back.
      #
      # Opening the release pull request is the half that actually needs the PAT, and only that
      # half: a pull request opened by `app/github-actions` gets CI runs that land in
      # `action_required` and never start, so the required checks never report and it sits
      # blocked until somebody presses "Approve and run" by hand. A release cut by GITHUB_TOKEN
      # has no such problem: cutting a release only creates a draft, and a draft never fires
      # `release: published` -- the event pages.yml listens for. That event only fires later,
      # from this same workflow's own "The release stops being a draft" step, under its own
      # RELEASE_PLEASE_TOKEN-or-GITHUB_TOKEN fallback (see pages.yml's `on:` block for what
      # happens when that fallback fires).
      - name: Cut the release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: rp
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          skip-github-pull-request: true
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Second, and after the pass above, which is load bearing rather than incidental. This pass
      # rebuilds release-please's picture of the repository from scratch, and what it finds
      # decides which commits the next release pull request claims. The tag the pass above
      # created is what stops it finding the release before last and proposing a version that
      # re-releases work already released -- the failure #127 produced at every run and #135
      # reverted the draft to escape.
      #
      # The `||` keeps releases working before the secret exists: an unset secret is the empty
      # string, which is falsy. The PAT needs contents:write and pull-requests:write on this
      # repository and nothing else.
      - name: Open or refresh the release pull request
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          skip-github-release: true
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
  # Everything that can fail runs before the release stops being a draft. That ordering used to be
  # a step list inside one job; it is a job graph now, because arm64 has to be built on an arm64
  # machine. The guarantee is unchanged and is asserted in
  # scripts/test/release-workflow-order.test.ts: nothing is pullable by tag until both
  # architectures have been built AND booted, and the draft is published only after that.
  #
  # QEMU is gone, and that is the point of this shape. arm64 used to be emulated on an amd64
  # runner, and emulating V8 is a known way to meet an instruction qemu cannot execute: the 1.32.0
  # publish died on `qemu: uncaught target signal 4 (Illegal instruction) - core dumped` inside
  # `pnpm install`, in two separate build stages, and then hung rather than failing - buildx sat
  # waiting on a process that was already dead, for 78 minutes against a 7 minute pipeline, until
  # it was cancelled by hand. Native runners remove the emulator rather than betting on a version
  # of it.
  verify:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    # A hang is a failure that never arrives. Without this the default is six hours of a runner
    # sitting on a dead process, which is exactly how 1.32.0 spent its morning.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm

      # The commit is already green on master. This is insurance against releasing a commit whose
      # CI never ran, which costs one wrong image on a registry other people pull from.
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

      # A vitest worker that dies on a signal reports the signal and nothing else: no stack, no
      # faulting frame, nothing saying which of the three hundred files mattered or what it was
      # doing. v1.14.1's publish job died exactly that way - one SIGSEGV, 302 files green, no
      # evidence - and the only reason the cause was ever found was a core dump taken by hand
      # afterwards. It pointed at V8's WebAssembly engine, reached through the type stripper every
      # worker thread was instantiating; rebuildWorker.ts carries the account, and that particular
      # trigger is gone now the rebuild runs in a forked process.
      #
      # This stays anyway, because what cost the time was not that crash in particular. It was
      # that a crash here says nothing at all, and the next one will be something else.
      - name: Let a crash leave a core behind
        run: |
          sudo mkdir -p /mnt/cores
          sudo chmod 1777 /mnt/cores
          echo '/mnt/cores/core.%e.%p' | sudo tee /proc/sys/kernel/core_pattern

      # ulimit is per shell, so it has to be raised in the same step that runs the suite. The
      # wrapper retries once and only when a worker CRASHED - a signal, with every test passed -
      # never when the suite failed on its own terms. This job exists to stop a release going out
      # on a commit whose tests do not pass, and a blanket retry would quietly undo that.
      - run: ulimit -c unlimited && bash scripts/retry-if-worker-crashed.sh pnpm test

      - name: Backtrace whatever crashed
        if: failure()
        run: |
          shopt -s nullglob
          cores=(/mnt/cores/core.*)
          if [ ${#cores[@]} -eq 0 ]; then
            echo "No core file, so the suite failed rather than crashed - read the test output above."
            exit 0
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq gdb
          for core in "${cores[@]}"; do
            echo "::group::$core"
            gdb -q -batch -ex 'thread apply all bt 40' "$(command -v node)" "$core" 2>&1 | tail -120
            echo "::endgroup::"
          done

  # One job per architecture, each on a machine of that architecture. Each builds its own image,
  # boots it, and only then pushes it BY DIGEST - which puts the layers in the registry without
  # attaching any tag to them. Nothing is pullable by tag until the publish job below runs, so
  # "both architectures boot before either is reachable" survives the split into jobs.
  image:
    needs: [release-please, verify]
    timeout-minutes: 45
    strategy:
      # Both results are wanted even when one fails: knowing that arm64 broke and amd64 did not is
      # most of the diagnosis, and fail-fast would cancel the healthy one before it said so.
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            # GitHub's native arm64 runner, free for public repositories. The whole reason this
            # matrix exists.
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      # No docker/setup-qemu-action. Deliberately: see the comment on `verify` above.
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Built and loaded first, so it is booted before anything reaches the registry.
      - name: Build ${{ matrix.arch }}
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: haelan:release-${{ matrix.arch }}
      - run: bash scripts/check-image-boots.sh haelan:release-${{ matrix.arch }} linux/${{ matrix.arch }}

      # Pushed by digest: layers and a manifest, no tag. The cache populated by the build above is
      # what makes this second invocation cheap, and push-by-digest is what keeps the registry free
      # of a half-released tag if the other architecture fails after this one succeeded.
      - name: Push ${{ matrix.arch }} by digest
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true

      - name: Hand the digest to the publish job
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.push.outputs.digest }}"
          if [ -z "$digest" ]; then
            echo "::error::the ${{ matrix.arch }} push reported no digest"
            exit 1
          fi
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # The tags appear here and nowhere else, out of digests that have each already booted.
  publish:
    needs: [release-please, image]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # `version` (a bare 1.2.3), never `tag` (v1.2.3): metadata-action parses the value as
          # semver and emits nothing at all when it cannot, which produces an image carrying only
          # `latest` with the job still green.
          #
          # latest is written here explicitly rather than left to the `latest=auto` flavour,
          # because that flavour reads the git ref, and on this workflow the ref is a branch. The
          # job only reaches this step when release-please cut a release, and release-please's own
          # config sets prerelease false, so a value arriving here is a full release.
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.version }}
            type=semver,pattern={{major}},value=${{ needs.release-please.outputs.version }}
            type=raw,value=latest

      # A release that publishes only `latest` moves the tag every install resolves while leaving
      # nothing pinnable behind it. Fail loudly rather than find out afterwards.
      - name: The version tags exist
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          echo "$TAGS"
          if ! echo "$TAGS" | grep -q ":${VERSION}$"; then
            echo "::error::release ${VERSION} computed no ${VERSION} image tag"
            exit 1
          fi

      # The multi-architecture tag, assembled from the exact digests that were booted. The old
      # single-job shape rebuilt everything a third time in order to push, and its own comment
      # admitted the gap that left: what reached the registry was only *probably* the bits that
      # had been booted. Naming digests closes it - these are those images, not a rebuild of the
      # same source.
      - name: Tag both architectures as one image
        working-directory: /tmp/digests
        run: |
          digests=(*)
          if [ ${#digests[@]} -ne 2 ]; then
            echo "::error::expected one digest per architecture, found ${#digests[@]}"
            exit 1
          fi
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository }}@sha256:%s ' *)
          docker buildx imagetools inspect \
            "ghcr.io/${{ github.repository }}:${{ needs.release-please.outputs.version }}"

      # This is what makes the release exist for anyone who is not a maintainer, and it is
      # deliberately the last thing that happens. Until it runs the release is a draft: invisible
      # on the Releases page, not returned as `latest`, not in the Atom feed.
      #
      # Drafting was tried once before, in #127, and reverted in #135 because it made the version
      # number fiction. GitHub does not create a draft's git tag until the draft is published, and
      # release-please drops every release whose tag does not resolve -- its release search is
      # literally `releases.filter(release => !!release.tagCommit)`. `force-tag-creation: true` in
      # release-please-config.json is what fixes that: release-please creates the tag itself,
      # before the release, so both of its lookups resolve and the ordering costs nothing. The two
      # settings are one mechanism and neither works alone; both are pinned in
      # scripts/test/release-workflow-order.test.ts.
      - name: The release stops being a draft
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.release-please.outputs.release_id }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          # Asserted rather than assumed: an empty id makes the URL below `/releases/`, which is
          # the list endpoint, and a PATCH to it would fail in a way that reads like a permissions
          # problem rather than like a missing output.
          if [ -z "$RELEASE_ID" ]; then
            echo "::error::release-please reported no release id for ${TAG}"
            exit 1
          fi
          # make_latest explicitly: it is applied when a release is published, and this release was
          # created as a draft, so leaving it to the default risks publishing a release the
          # Releases page still does not call the latest one.
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -F draft=false -f make_latest=true \
            --jq '"published \(.tag_name) (draft=\(.draft)): \(.html_url)"'

      # A failure above is correct behaviour -- the draft stays a draft -- but it is quiet. Say
      # plainly what state the repository is in, because the wrong recovery is available and
      # tempting: publishing the draft by hand from the Releases UI produces exactly the
      # release-pointing-at-no-image that this ordering exists to prevent.
      - name: Say what a failure left behind
        if: failure()
        env:
          TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          {
            echo "## ${TAG} is tagged, but not released"
            echo
            echo "This run did not finish, so no tag on \`ghcr.io/${GITHUB_REPOSITORY}\` points at"
            echo "\`${TAG}\` yet. The release is still a draft: nobody browsing the Releases page"
            echo "can see it, and \`latest\` still points at the previous version."
            echo
            echo "The git tag \`${TAG}\` **does** exist. That is deliberate -- release-please cannot"
            echo "find its own previous release without it, and a missing tag is how the version"
            echo "numbers became fiction in #127. Leave the tag alone."
            echo
            echo "To recover: fix the cause and use **Re-run failed jobs**, which keeps the"
            echo "release-please outputs every job here is gated on."
            echo
            echo "Do **not** use *Re-run all jobs*. Release Please refuses to cut a release that"
            echo "already exists, so \`release-please\` reports nothing released, every job below it"
            echo "is skipped on its \`if:\` -- and the run goes green having published nothing."
            echo
            echo "Do **not** publish the draft by hand from the Releases page -- that is precisely"
            echo "the release-pointing-at-a-missing-image this ordering exists to prevent."
          } >> "$GITHUB_STEP_SUMMARY"
