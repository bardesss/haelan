name: Release

# Release Please watches master, keeps a release pull request up to date from the conventional
# commit titles that land here, and cuts the release when that pull request is merged. Tagging by
# hand is gone: the two times it was done in this project's first day of being public, the tag was
# forgotten both times and the release simply did not happen.
on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write
  packages: write

# Not cancel-in-progress: killing a publish partway through, after amd64 pushed and before arm64
# does, is worse than making the second run wait for the first.
concurrency:
  group: ${{ github.workflow }}

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.rp.outputs.release_created }}
      version: ${{ steps.rp.outputs.version }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: rp
        with:
          # A PAT rather than GITHUB_TOKEN, because a release pull request opened by
          # `app/github-actions` gets CI runs that land in `action_required` and never start, so
          # the required checks never report and the pull request sits blocked until somebody
          # presses "Approve and run" by hand. The `||` keeps releases working before the secret
          # exists: an unset secret is the empty string, which is falsy. It needs contents:write
          # and pull-requests:write on this repository and nothing else.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Only on a release, and everything here has to pass before the release stops being a draft.
  publish:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm

      # The commit is already green on master. This is insurance against releasing a commit whose
      # CI never ran, which costs one wrong image on a registry other people pull from.
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

      # arm64 runs under emulation, which is what lets the boot check below start it. The native
      # prebuilds differ per architecture, so the one that is not booted is the one most likely
      # to be broken.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # `version` (a bare 1.2.3), never `tag` (v1.2.3): metadata-action parses the value as
          # semver and emits nothing at all when it cannot, which produces an image carrying only
          # `latest` with the job still green.
          #
          # latest is written here explicitly rather than left to the `latest=auto` flavour,
          # because that flavour reads the git ref, and on this workflow the ref is a branch. The
          # job only reaches this step when release-please cut a release, and release-please's
          # own config sets prerelease false, so a value arriving here is a full release.
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.version }}
            type=semver,pattern={{major}},value=${{ needs.release-please.outputs.version }}
            type=raw,value=latest

      # A release that publishes only `latest` moves the tag every install resolves while leaving
      # nothing pinnable behind it. Fail loudly rather than find out afterwards.
      - name: The version tags exist
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          echo "$TAGS"
          if ! echo "$TAGS" | grep -q ":${VERSION}$"; then
            echo "::error::release ${VERSION} computed no ${VERSION} image tag"
            exit 1
          fi

      # Built and loaded per architecture first, so each one is booted before anything is pushed.
      - name: Build and boot amd64
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: haelan:release-amd64
      - run: bash scripts/check-image-boots.sh haelan:release-amd64 linux/amd64

      - name: Build and boot arm64
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: haelan:release-arm64
      - run: bash scripts/check-image-boots.sh haelan:release-arm64 linux/arm64

      # This is a third, separate invocation, not a re-push of the two images just booted above --
      # build-push-action has no "push what you already built" mode. It relies on the per-platform
      # buildx cache populated by those two builds to hit, so what reaches the registry is
      # *probably* the exact bits that were booted, not provably so. That gap is accepted, not
      # fixed, here.
      - name: Push both architectures
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # There used to be a step here that published a draft release once the image was in the
      # registry, so a release page could never point at an image that failed to publish. It is
      # gone, and the reason is worth keeping rather than quietly dropping.
      #
      # A draft release carries no git tag, and release-please finds its own previous releases by
      # tag. With `draft: true` it never found one: every run reported "No latest release found"
      # and recomputed the version by walking all 217 commits in this repository's history. That
      # history always contains a `feat:`, so every run proposed at least a minor bump, and
      # merging a release opened another release for no changes. 1.2.0, 1.3.0 and a proposed
      # 1.4.0 were produced that way, each containing only its own release commit.
      #
      # So the ordering guarantee was real and the mechanism that bought it made the version
      # number fiction, which is the worse of the two. What is left is a window of about seven
      # minutes between the release existing and the image reaching the registry. A failure in it
      # is loud, a red run, and recoverable by rerunning or deleting the release, where a version
      # computed from the wrong base is neither.
