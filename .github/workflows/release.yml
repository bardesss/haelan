name: Release

# Release Please watches master, keeps a release pull request up to date from the conventional
# commit titles that land here, and cuts the release when that pull request is merged. Tagging by
# hand is gone: the two times it was done in this project's first day of being public, the tag was
# forgotten both times and the release simply did not happen.
on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write
  packages: write

# Not cancel-in-progress: killing a publish partway through, after amd64 pushed and before arm64
# does, is worse than making the second run wait for the first.
concurrency:
  group: ${{ github.workflow }}

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.rp.outputs.release_created }}
      version: ${{ steps.rp.outputs.version }}
      tag: ${{ steps.rp.outputs.tag_name }}
      # The release is cut as a draft and published at the end of `publish`, and this is what
      # names it there. The id rather than the tag: `repos/.../releases/tags/{tag}` does not
      # return drafts, so anything that looks a release up by tag finds nothing until after the
      # step that needed it has run.
      release_id: ${{ steps.rp.outputs.id }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: rp
        with:
          # A PAT rather than GITHUB_TOKEN, because a release pull request opened by
          # `app/github-actions` gets CI runs that land in `action_required` and never start, so
          # the required checks never report and the pull request sits blocked until somebody
          # presses "Approve and run" by hand. The `||` keeps releases working before the secret
          # exists: an unset secret is the empty string, which is falsy. It needs contents:write
          # and pull-requests:write on this repository and nothing else.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Only on a release. Everything here has to pass before the release stops being a draft, which
  # is the last step in the job, so a failure anywhere leaves a draft nobody browsing can see
  # rather than a finished-looking release page pointing at an image that was never pushed.
  publish:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm

      # The commit is already green on master. This is insurance against releasing a commit whose
      # CI never ran, which costs one wrong image on a registry other people pull from.
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

      # arm64 runs under emulation, which is what lets the boot check below start it. The native
      # prebuilds differ per architecture, so the one that is not booted is the one most likely
      # to be broken.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # `version` (a bare 1.2.3), never `tag` (v1.2.3): metadata-action parses the value as
          # semver and emits nothing at all when it cannot, which produces an image carrying only
          # `latest` with the job still green.
          #
          # latest is written here explicitly rather than left to the `latest=auto` flavour,
          # because that flavour reads the git ref, and on this workflow the ref is a branch. The
          # job only reaches this step when release-please cut a release, and release-please's
          # own config sets prerelease false, so a value arriving here is a full release.
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.version }}
            type=semver,pattern={{major}},value=${{ needs.release-please.outputs.version }}
            type=raw,value=latest

      # A release that publishes only `latest` moves the tag every install resolves while leaving
      # nothing pinnable behind it. Fail loudly rather than find out afterwards.
      - name: The version tags exist
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          echo "$TAGS"
          if ! echo "$TAGS" | grep -q ":${VERSION}$"; then
            echo "::error::release ${VERSION} computed no ${VERSION} image tag"
            exit 1
          fi

      # Built and loaded per architecture first, so each one is booted before anything is pushed.
      - name: Build and boot amd64
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: haelan:release-amd64
      - run: bash scripts/check-image-boots.sh haelan:release-amd64 linux/amd64

      - name: Build and boot arm64
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: haelan:release-arm64
      - run: bash scripts/check-image-boots.sh haelan:release-arm64 linux/arm64

      # This is a third, separate invocation, not a re-push of the two images just booted above --
      # build-push-action has no "push what you already built" mode. It relies on the per-platform
      # buildx cache populated by those two builds to hit, so what reaches the registry is
      # *probably* the exact bits that were booted, not provably so. That gap is accepted, not
      # fixed, here.
      - name: Push both architectures
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # This is what makes the release exist for anyone who is not a maintainer, and it is
      # deliberately the last thing the job does. Until it runs the release is a draft: invisible
      # on the Releases page, not returned as `latest`, not in the Atom feed.
      #
      # Drafting was tried once before, in #127, and reverted in #135 because it made the version
      # number fiction. The cause was precise and is worth writing down rather than leaving to be
      # rediscovered a third time. GitHub does not create a draft's git tag until the draft is
      # published, and release-please drops every release whose tag does not resolve -- its
      # release search is literally `releases.filter(release => !!release.tagCommit)`, and the
      # fallback that recovers a release the search missed looks it up by tag as well. So with a
      # lazily-tagged draft release-please found no previous release at all: it backfilled one
      # from the manifest with `sha: ''`, never matched that sha while walking history, and
      # recomputed the version from all 217 commits in the repository. That history always holds
      # a `feat:`, so every run proposed a minor bump and merging a release opened another
      # release containing only its own release commit. 1.2.0, 1.3.0 and a proposed 1.4.0 came
      # out that way.
      #
      # What is different now is `force-tag-creation: true` in release-please-config.json.
      # release-please creates the git tag itself, with an explicit createRef, before it creates
      # the release -- so the tag exists from the moment the draft does, both of its lookups
      # resolve, and the ordering guarantee costs nothing. The option exists upstream for exactly
      # this: "particularly useful when `draft` is enabled, because GitHub does not create a Git
      # tag for draft releases until they are published."
      #
      # The two settings are one mechanism and neither works alone. `draft` without
      # `force-tag-creation` is #127 again; `force-tag-creation` without `draft` is a tag
      # release-please would have created anyway. Both are pinned together in
      # scripts/test/release-workflow-order.test.ts.
      - name: The release stops being a draft
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.release-please.outputs.release_id }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          # Asserted rather than assumed: an empty id makes the URL below `/releases/`, which is
          # the list endpoint, and a PATCH to it would fail in a way that reads like a permissions
          # problem rather than like a missing output.
          if [ -z "$RELEASE_ID" ]; then
            echo "::error::release-please reported no release id for ${TAG}"
            exit 1
          fi
          # make_latest explicitly: it is applied when a release is published, and this release
          # was created as a draft, so leaving it to the default risks publishing a release the
          # Releases page still does not call the latest one.
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -F draft=false -f make_latest=true \
            --jq '"published \(.tag_name) (draft=\(.draft)): \(.html_url)"'

      # A failure above is correct behaviour -- the draft stays a draft -- but it is quiet. The
      # release page looks like nothing happened because to everyone except a maintainer nothing
      # did, and the red run is one line in a list of runs. Say plainly what state the repository
      # is in, because the wrong recovery is available and tempting: publishing the draft by hand
      # from the Releases UI produces exactly the release-pointing-at-no-image that this ordering
      # exists to prevent.
      - name: Say what a failure left behind
        if: failure()
        env:
          TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          {
            echo "## ${TAG} is tagged, but not released"
            echo
            echo "This job did not finish, so the image for \`${TAG}\` may not be on"
            echo "\`ghcr.io/${GITHUB_REPOSITORY}\`. The release is still a draft: nobody browsing"
            echo "the Releases page can see it, and \`latest\` still points at the previous version."
            echo
            echo "The git tag \`${TAG}\` **does** exist. That is deliberate -- release-please cannot"
            echo "find its own previous release without it, and a missing tag is how the version"
            echo "numbers became fiction in #127. Leave the tag alone."
            echo
            echo "To recover: fix the cause and re-run this job. Its last step publishes the draft."
            echo "Do **not** publish the draft by hand from the Releases page -- that is precisely the"
            echo "release-pointing-at-a-missing-image this ordering exists to prevent."
          } >> "$GITHUB_STEP_SUMMARY"
