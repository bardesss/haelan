name: Release

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm

      # The commit is already green on master. This is insurance against tagging a commit whose
      # CI never ran, which costs one wrong image on a registry other people pull from.
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

      # arm64 runs under emulation, which is what lets the boot check below start it. The native
      # prebuilds differ per architecture, so the one that is not booted is the one most likely
      # to be broken.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # v1.2.3 publishes 1.2.3, 1.2, 1 and latest. latest moves because compose.yaml pins it.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      # Built and loaded per architecture first, so each one is booted before anything is pushed.
      - name: Build and boot amd64
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: haelan:release-amd64
      - run: bash scripts/check-image-boots.sh haelan:release-amd64 linux/amd64

      - name: Build and boot arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: haelan:release-arm64
      - run: bash scripts/check-image-boots.sh haelan:release-arm64 linux/arm64

      - name: Push both architectures
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
