name: Pages

# Its own workflow rather than a job inside release.yml, deliberately. That pipeline has already
# produced an orphaned release and a version whose image never reached the registry; a site deploy
# must not be able to add a third way for it to half-finish, and a failed deploy here must not be
# able to hold up a release. The worst case this shape allows is a site one version behind, which
# a manual run fixes.
# On push rather than on `release: published`, which this workflow tried first and which never
# once worked. Both of its failure modes are recorded here because either alone would have been
# enough, and fixing only one would have looked like a fix:
#
#   - v1.20.0 did start a run, and the deploy job was rejected in one second: "Tag v1.20.0 is not
#     allowed to deploy to github-pages due to environment protection rules." The github-pages
#     environment allows exactly one ref, the branch master, and a release run's ref is the tag.
#   - v1.21.0 started no run at all. The draft is published by release.yml under
#     `secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN`, and GitHub starts no workflow from an
#     event attributed to the default GITHUB_TOKEN. That fallback is a state the token has been in
#     before.
#
# Every deploy this site has ever had was a workflow_dispatch by hand. A push to master has
# neither problem: the run's ref is master, which the environment allows, and a push is nobody's
# token.
#
# The objection this shape was designed against - that deploying on push publishes a page claiming
# a release that has not been cut - does not hold. The page's version and date come from
# package.json and CHANGELOG.md (see releaseStamp in scripts/build-site.mjs), and release-please
# moves those only in a release commit, so a build from any master commit names the last release
# truthfully. The cost is a deploy per merge instead of per release, which is a minute and a half
# of Actions.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Not cancel-in-progress: a half-finished Pages deployment is worse than a queued one.
concurrency:
  group: pages

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # 26, not release.yml's 24: this job builds the static site, not the published image, so
          # there is no reason to match the image's runtime. It matches what development runs on
          # and what ci.yml's matrix already exercises on every push instead.
          node-version: '26'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Seeds a throwaway directory, boots a real instance against it and records what every page
      # asks for. Minutes rather than seconds - it runs a rebuild over a year of generated data -
      # which is why it lives here and not in ci.yml's default path.
      - run: pnpm demo:capture

      - run: pnpm demo:build

      # Builds the token stylesheet first: the site copies packages/tokens/dist/theme.css, which
      # does not exist in a fresh checkout.
      - run: pnpm site:build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
