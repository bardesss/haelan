name: Pages

# Its own workflow rather than a job inside release.yml, deliberately. That pipeline has already
# produced an orphaned release and a version whose image never reached the registry; a site deploy
# must not be able to add a third way for it to half-finish, and a failed deploy here must not be
# able to hold up a release. The worst case this shape allows is a site one version behind, which
# a manual run fixes.
# `release: published` fires when release.yml's "The release stops being a draft" step flips
# the draft, which runs under `secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN`. GitHub does
# not start workflow runs from events attributed to the default GITHUB_TOKEN, so on the `||`
# fallback - a state that token has actually been in - that PATCH still publishes the release, but
# this workflow does not run: no red run, no annotation, the published page just stays on the
# previous version until someone runs workflow_dispatch by hand.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Not cancel-in-progress: a half-finished Pages deployment is worse than a queued one.
concurrency:
  group: pages

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # 26, not release.yml's 24: this job builds the static site, not the published image, so
          # there is no reason to match the image's runtime. It matches what development runs on
          # and what ci.yml's matrix already exercises on every push instead.
          node-version: '26'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Builds the token stylesheet first: the site copies packages/tokens/dist/theme.css, which
      # does not exist in a fresh checkout.
      - run: pnpm site:build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
