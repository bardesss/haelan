name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22.13 is the engines floor, set by pnpm 11 rather than by our own code,
        # and 26 is what development runs on. Testing both means the floor is
        # verified rather than asserted: the first CI run caught it declared as
        # 22.6, which pnpm refuses to install on. 24 is what the published
        # image runs, so by the same argument the shipped runtime is verified
        # rather than asserted.
        node: ['22.13', '24', '26']

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      # A vitest worker that dies on a signal reports the signal and nothing else: no stack, no
      # faulting frame, nothing saying which of the three hundred files mattered or what it was
      # doing. v1.14.1's publish job died exactly that way - one SIGSEGV, 302 files green, no
      # evidence - and the only reason the cause was ever found was a core dump taken by hand
      # afterwards. It pointed at V8's WebAssembly engine, reached through the type stripper every
      # worker thread was instantiating; rebuildWorker.ts carries the account, and that particular
      # trigger is gone now the rebuild runs in a forked process.
      #
      # This stays anyway, because what cost the time was not that crash in particular. It was
      # that a crash here says nothing at all, and the next one will be something else. Cores are
      # off by default on the runners, so it would be just as silent. It costs nothing on a green
      # run: setting core_pattern is one write, the ulimit is free, and gdb is installed only
      # after a failure. /mnt is the runner's large temp disk - a Node core is several gigabytes,
      # and / does not have room for one.
      - name: Let a crash leave a core behind
        run: |
          sudo mkdir -p /mnt/cores
          sudo chmod 1777 /mnt/cores
          echo '/mnt/cores/core.%e.%p' | sudo tee /proc/sys/kernel/core_pattern

      # ulimit is per shell, so it has to be raised in the same step that runs the suite. Joined
      # with && rather than split over a `run: |` block on purpose: release-workflow-order.test.ts
      # reads each step by the line that opens it, and `pnpm test` moving onto a line below the
      # step's name is invisible to it - which reads there as the workflow having stopped running
      # the suite at all.
      - run: ulimit -c unlimited && pnpm test

      - name: Backtrace whatever crashed
        if: failure()
        run: |
          shopt -s nullglob
          cores=(/mnt/cores/core.*)
          if [ ${#cores[@]} -eq 0 ]; then
            echo "No core file, so the suite failed rather than crashed - read the test output above."
            exit 0
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq gdb
          for core in "${cores[@]}"; do
            echo "::group::$core"
            gdb -q -batch -ex 'thread apply all bt 40' "$(command -v node)" "$core" 2>&1 | tail -120
            echo "::endgroup::"
          done

      # Runs the token stylesheet generation through its prebuild hook, so a
      # broken emitter fails here rather than in someone's browser.
      - run: pnpm build

      - name: Check the generated stylesheet is not committed
        run: |
          if git ls-files --error-unmatch apps/web/src/theme.generated.css > /dev/null 2>&1; then
            echo "theme.generated.css is a build output and must not be tracked"
            exit 1
          fi

  # demo:capture seeds a year of generated data and reruns a rebuild over it, which costs minutes
  # rather than seconds - too much to pay on every push. So this rehearses the chain pages.yml
  # runs on every deploy (capture, then build, then site:build) only for a pull request whose diff
  # can actually break it, and only proves it once rather than once per verify matrix leg.
  demo-rehearsal:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }

      - id: touched
        # Four of these five are the brief's own list: the recorder and the capture script that
        # drives it, the demo's own app-side code, and the routes whose response shapes the
        # fixtures are. scripts/seed-demo.mjs is added because it is what the capture script
        # spawns to build the throwaway instance in the first place - a break there fails
        # demo:capture exactly as surely as a broken recorder does, and nothing under
        # scripts/capture-demo* names it. apps/web/vite.demo.config.ts and apps/web/index.demo.html
        # are added for the same reason on the build side: they are demo:build's own config and
        # entry point, forced to live beside vite.config.ts and index.html rather than under
        # src/demo/ (Vite resolves both by fixed name), and neither has a fast unit test the way
        # copyDemo and writeCapture do - this rehearsal is the only thing that would ever catch a
        # break in either.
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD \
            | grep -qE '^(demo/|apps/web/src/demo/|apps/web/vite\.demo\.config\.ts|apps/web/index\.demo\.html|scripts/capture-demo|scripts/seed-demo|apps/server/src/routes/v1/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # 26, matching pages.yml's build job: this rehearses that job's own chain, so it runs on
          # the same runtime pages.yml deploys with rather than the verify matrix's three floors.
          node-version: '26'
          cache: pnpm

      - run: pnpm install --frozen-lockfile && pnpm demo:all
        if: steps.touched.outputs.run == 'true'
