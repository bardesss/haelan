name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22.14 is the engines floor and 26 is what development runs on. Testing
        # both means the floor is verified rather than asserted: the first CI run
        # caught it declared as 22.6, which pnpm refuses to install on. 24 is what
        # the published image runs, so by the same argument the shipped runtime is
        # verified rather than asserted.
        #
        # The floor was 22.13, set by pnpm 11. better-sqlite3 13 raised it: its
        # addon is built with NAPI_VERSION=10, and NODE_API_SUPPORTED_VERSION_MAX
        # is 9 in 22.13 and 10 from 22.14 on. Below 22.14 Node does not refuse the
        # addon, it segfaults inside napi_module_register_by_symbol while loading
        # it, so every test that opens a database dies with SIGSEGV and nothing
        # says why. This leg is what proves the floor is the real one.
        node: ['22.14', '24', '26']

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      # A vitest worker that dies on a signal reports the signal and nothing else: no stack, no
      # faulting frame, nothing saying which of the three hundred files mattered or what it was
      # doing. v1.14.1's publish job died exactly that way - one SIGSEGV, 302 files green, no
      # evidence - and the only reason the cause was ever found was a core dump taken by hand
      # afterwards. It pointed at V8's WebAssembly engine, reached through the type stripper every
      # worker thread was instantiating; rebuildWorker.ts carries the account, and that particular
      # trigger is gone now the rebuild runs in a forked process.
      #
      # This stays anyway, because what cost the time was not that crash in particular. It was
      # that a crash here says nothing at all, and the next one will be something else. Cores are
      # off by default on the runners, so it would be just as silent. It costs nothing on a green
      # run: setting core_pattern is one write, the ulimit is free, and gdb is installed only
      # after a failure. /mnt is the runner's large temp disk - a Node core is several gigabytes,
      # and / does not have room for one.
      - name: Let a crash leave a core behind
        run: |
          sudo mkdir -p /mnt/cores
          sudo chmod 1777 /mnt/cores
          echo '/mnt/cores/core.%e.%p' | sudo tee /proc/sys/kernel/core_pattern

      # ulimit is per shell, so it has to be raised in the same step that runs the suite. Joined
      # with && rather than split over a `run: |` block on purpose: release-workflow-order.test.ts
      # reads each step by the line that opens it, and `pnpm test` moving onto a line below the
      # step's name is invisible to it - which reads there as the workflow having stopped running
      # the suite at all.
      - run: ulimit -c unlimited && pnpm test

      - name: Backtrace whatever crashed
        if: failure()
        run: |
          shopt -s nullglob
          cores=(/mnt/cores/core.*)
          if [ ${#cores[@]} -eq 0 ]; then
            echo "No core file, so the suite failed rather than crashed - read the test output above."
            exit 0
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq gdb
          for core in "${cores[@]}"; do
            echo "::group::$core"
            gdb -q -batch -ex 'thread apply all bt 40' "$(command -v node)" "$core" 2>&1 | tail -120
            echo "::endgroup::"
          done

      # Runs the token stylesheet generation through its prebuild hook, so a
      # broken emitter fails here rather than in someone's browser.
      - run: pnpm build

      # MapLibre builds its worker's URL from strings at runtime, which the bundler cannot see, so
      # a build can succeed with no worker in it and every workout map then draws its tiles and
      # never its route. loadMapLibre.ts hands it the one Vite emits; this checks there is one.
      - name: Check the MapLibre worker was emitted
        run: |
          if ! ls apps/web/dist/assets | grep -q '^maplibre-gl-worker-.*\.js$'; then
            echo "apps/web/dist/assets has no maplibre-gl-worker bundle; workout maps would draw no route"
            exit 1
          fi

      - name: Check the generated stylesheet is not committed
        run: |
          if git ls-files --error-unmatch apps/web/src/theme.generated.css > /dev/null 2>&1; then
            echo "theme.generated.css is a build output and must not be tracked"
            exit 1
          fi

      # The Android palette is the second emitted target of @haelan/tokens, and the file it
      # replaced is the one somebody would put back: a hand-written res/values/colors.xml is a
      # second definition of the palette, which is what removed it.
      - name: Check the Android palette is not committed
        run: |
          if git ls-files --error-unmatch apps/android/app/src/main/res/values/colors.xml > /dev/null 2>&1; then
            echo "res/values/colors.xml is a build output and must not be tracked"
            exit 1
          fi

  # demo:capture seeds a year of generated data and reruns a rebuild over it, which costs minutes
  # rather than seconds - too much to pay on every push. So this rehearses the chain pages.yml
  # runs on every deploy (capture, then build, then site:build) only for a pull request whose diff
  # can actually break it, and only proves it once rather than once per verify matrix leg.
  demo-rehearsal:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }

      - id: touched
        # Four of these five are the brief's own list: the recorder and the capture script that
        # drives it, the demo's own app-side code, and the routes whose response shapes the
        # fixtures are. scripts/seed-demo.mjs is added because it is what the capture script
        # spawns to build the throwaway instance in the first place - a break there fails
        # demo:capture exactly as surely as a broken recorder does, and nothing under
        # scripts/capture-demo* names it. apps/web/vite.demo.config.ts and apps/web/index.demo.html
        # are added for the same reason on the build side: they are demo:build's own config and
        # entry point, forced to live beside vite.config.ts and index.html rather than under
        # src/demo/ (Vite resolves both by fixed name), and neither has a fast unit test the way
        # copyDemo and writeCapture do - this rehearsal is the only thing that would ever catch a
        # break in either.
        run: |
          # Captured into a variable and checked before it is ever piped into grep. `if cmd |
          # grep -q ...` suspends errexit for the whole pipeline, so a git diff that itself fails
          # (an unknown revision, a base ref renamed mid-flight) would otherwise fall straight
          # into grep's "no match" branch and report run=false - a gate that cannot tell "nothing
          # touched the chain" from "I could not look" is not a gate, it is this job going green
          # having proved nothing, which is exactly the failure mode it exists to catch.
          touched=$(git diff --name-only origin/${{ github.base_ref }}...HEAD) \
            || { echo "::error::could not diff against the base branch"; exit 1; }
          if echo "$touched" \
            | grep -qE '^(demo/|apps/web/src/demo/|apps/web/vite\.demo\.config\.ts|apps/web/index\.demo\.html|scripts/capture-demo|scripts/seed-demo|apps/server/src/routes/v1/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # 26, matching pages.yml's build job: this rehearses that job's own chain, so it runs on
          # the same runtime pages.yml deploys with rather than the verify matrix's three floors.
          node-version: '26'
          cache: pnpm

      - run: pnpm install --frozen-lockfile && pnpm demo:all
        if: steps.touched.outputs.run == 'true'

  # The one check that can see a page wider than its screen. apps/web renders to static markup and
  # happy-dom has no layout engine, so the 700px-against-375px overflow M7 fixes was invisible to
  # every other job here.
  #
  # Runs on push to master as well as on pull requests, and the push leg is what makes the cache
  # below worth having. A cache entry is written in the scope of the ref that wrote it, and a
  # pull_request run can restore only from its own branch scope or from the default branch's. With
  # this job gated to pull requests alone, nothing ever wrote a default-branch entry, so every
  # first run on every branch was a guaranteed miss and paid for demo:capture - the cost the
  # rehearsal job above calls too much to pay on every push.
  layout:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    # Microsoft's own image, pinned to the same version as the `playwright` dependency, because the
    # browsers are already unpacked in it at /ms-playwright and this job therefore downloads and
    # installs nothing.
    #
    # That is not a convenience. `playwright install chromium` hangs after the download completes,
    # while it unpacks: measured here at 173.9 MiB fetched in about a second and then ten minutes of
    # silence until the step's own timeout, and measured again on a Windows workstation during M7a,
    # where it stalled three times in a row just after writing chrome.dll. Two operating systems,
    # same stall, so the cause is the unpacking rather than either machine. An image that ships the
    # browser already unpacked removes the step that fails instead of retrying it.
    #
    # The tag must move with the dependency. A container whose browsers are a different build from
    # the `playwright` package driving them is the one way this arrangement breaks, and it breaks
    # loudly at launch rather than quietly.
    #
    # scripts/test/playwright-pin-parity.test.ts holds the two in step, because a dependency bump
    # cannot edit a workflow: the first one to arrive moved playwright to 1.63.0 and left this at
    # 1.56.0, and the drift cost a CI round trip on this job to find.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    # A ceiling regardless. This job drives two real browsers and can wait on a network or on a page
    # that never settles, and without one it does not fail, it runs to the six hour default, which is
    # worse than a red check because nobody watches a job that is still running.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Before the fixture cache rather than after it, because the two checks below this line need
      # nothing it produces. The wizard and the sign-in screen are measured against a server booted
      # on a temporary directory, so an ordinary `pnpm build` is the whole of their input - seconds,
      # and they fail the job here rather than after the minutes demo:capture can cost.
      - run: pnpm build

      # The screens the demo cannot render. It is an already-signed-in instance against a recorded
      # database, so the setup wizard (which needs an unfinished instance) and the sign-in screen
      # (which needs a finished one with nobody signed in) are unreachable from layout:check by
      # construction, and had never been measured at any viewport before this.
      - run: pnpm layout:check:boot

      # Keyed on everything that decides what the fixtures contain: the recorder, the scripts that
      # build the throwaway instance, the routes whose shapes are recorded, core, which is what
      # derives the values in them, and apps/web/src - the recorder mounts real app code and
      # records exactly what each mounted page fetches, so a page gaining or dropping a query
      # changes the manifest as surely as a route change does. A miss rebuilds them, which is the
      # cost demo-rehearsal already pays; a hit is seconds.
      #
      # restore-keys is deliberately not load-bearing. It lets a run restore the newest fixture
      # directory when the exact key misses; what it must never do is let the run believe those
      # fixtures are current, because a prefix match is by definition an entry keyed off different
      # sources. cache-hit is 'true' on an exact match and nothing else, which is why the capture
      # step below tests exactly that and not `cache-matched-key`, which a prefix match sets too.
      # So a prefix hit re-runs demo:capture, and writeCapture clears the directory before it
      # writes, leaving nothing restored to survive into the build. That is the stale-fixture bug
      # review already closed once, left closed.
      - id: fixtures
        uses: actions/cache@v6
        with:
          path: demo/capture/out
          key: demo-fixtures-${{ hashFiles('demo/capture/**', 'scripts/capture-demo.mjs', 'scripts/seed-demo.mjs', 'apps/server/src/routes/v1/**', 'packages/core/src/**', 'apps/web/src/**') }}
          restore-keys: demo-fixtures-

      - run: pnpm demo:capture
        if: steps.fixtures.outputs.cache-hit != 'true'

      # layout:build does not exist - it was dropped in Task 4 because its DEMO_BASE=/ prefix is
      # not valid on Windows. demo:build already produces dist-demo under the /haelan/demo/ prefix
      # layout:check expects, so that is what runs here instead.
      - run: pnpm demo:build
      - run: pnpm layout:check
