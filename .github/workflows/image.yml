name: Image

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The file a person downloads and runs, checked the one way CI can: :latest doesn't resolve
      # until a release has run, so this can't be `up`-ed here, but `config` needs no registry and
      # still catches a bad port, a bad volume path, or a YAML typo.
      - name: Validate compose.yaml
        run: docker compose -f compose.yaml config -q

      - uses: docker/setup-buildx-action@v3

      # Loaded into the local daemon rather than pushed: this job proves the image works, and
      # nothing here should be able to publish one.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: haelan:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Boot it from an empty volume, twice
        run: bash scripts/check-image-boots.sh haelan:ci
