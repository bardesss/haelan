version: 2

updates:
  # Grouped per ecosystem per week; ungrouped updates on this workspace would bury security updates in noise.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: 'ci'

  # One entry for the whole workspace. Listing each package as its own directory
  # makes Dependabot bump a manifest it cannot write a lockfile for, and CI then
  # fails on --frozen-lockfile.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Majors get their own pull request rather than riding along with patches. Grouping by
    # dependency type alone put a TypeScript 7 migration and an @types/node jump in the same
    # pull request as a vite patch, so the safe three quarters of it could not be merged
    # without taking the risky quarter. A major deserves to be judged on its own, and a patch
    # deserves to land without waiting for one.
    groups:
      production:
        dependency-type: production
        patterns: ['*']
        update-types: ['minor', 'patch']
      production-major:
        dependency-type: production
        patterns: ['*']
        update-types: ['major']
      development:
        dependency-type: development
        patterns: ['*']
        update-types: ['minor', 'patch']
      development-major:
        dependency-type: development
        patterns: ['*']
        update-types: ['major']
    commit-message:
      prefix: 'deps'
      prefix-development: 'deps(dev)'
