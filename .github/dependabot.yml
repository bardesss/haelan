version: 2

updates:
  # Grouped per ecosystem per week; ungrouped updates on this workspace would bury security updates in noise.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: 'ci'

  # One entry for the whole workspace. Listing each package as its own directory
  # makes Dependabot bump a manifest it cannot write a lockfile for, and CI then
  # fails on --frozen-lockfile.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      production:
        dependency-type: production
        patterns: ['*']
      development:
        dependency-type: development
        patterns: ['*']
    commit-message:
      prefix: 'deps'
      prefix-development: 'deps(dev)'
