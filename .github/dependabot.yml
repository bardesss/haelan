version: 2

updates:
  # Grouped per ecosystem per week; ungrouped updates on this workspace would bury security updates in noise.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: 'ci'

  # One entry for the whole workspace. Listing each package as its own directory
  # makes Dependabot bump a manifest it cannot write a lockfile for, and CI then
  # fails on --frozen-lockfile.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Majors get their own pull request rather than riding along with patches. Grouping by
    # dependency type alone put a TypeScript 7 migration and an @types/node jump in the same
    # pull request as a vite patch, so the safe three quarters of it could not be merged
    # without taking the risky quarter. A major deserves to be judged on its own, and a patch
    # deserves to land without waiting for one.
    groups:
      production:
        dependency-type: production
        patterns: ['*']
        update-types: ['minor', 'patch']
      production-major:
        dependency-type: production
        patterns: ['*']
        update-types: ['major']
      development:
        dependency-type: development
        patterns: ['*']
        update-types: ['minor', 'patch']
      development-major:
        dependency-type: development
        patterns: ['*']
        update-types: ['major']
    # `build(deps)` rather than a bare `deps`, because the prefix Dependabot writes here becomes
    # the pull request title, and the PR title workflow requires a conventional commit type. `deps`
    # is not one, so every Dependabot pull request opened since that workflow landed has failed the
    # check and had to be retitled by hand before it could be merged. `build` is a type the workflow
    # accepts and one Release Please cuts nothing for, which is what a dependency bump should do.
    commit-message:
      prefix: 'build(deps)'
      prefix-development: 'build(deps-dev)'
