<!doctype html>
<!-- No data-theme: the stylesheet follows the reader's system and dark is its fallback.
     Pinning one here is how the light theme stayed unreachable. Set data-theme="dark" or
     "light" to force one; a toggle that writes this attribute is M3's. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hælan</title>
    <!-- The svg carries its own prefers-color-scheme rule, so one file covers both themes and
         stays sharp at every size a browser asks for. The ico is the fallback for anything that
         will not take an svg icon, and holds 16/32/48 with alpha. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="48x48 32x32 16x16" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0A0E17" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F5F7FB" media="(prefers-color-scheme: light)" />
    <script>
      // Puts a deep link back together before React reads the location.
      //
      // GitHub Pages serves the SITE ROOT's 404.html for a missing path and ignores one in a
      // subdirectory - assumed otherwise while this was built, and disproved by the first real
      // deploy, where /haelan/demo/sleep hit GitHub's own not-found page. site/404.html therefore
      // rewrites such a path to /haelan/demo/?/sleep, which is a real file, and this undoes that
      // rewrite so the router sees the address the visitor actually asked for.
      //
      // Before the module script on purpose: router.tsx reads window.location on its first render,
      // so a restore that ran after hydration would route to the wrong page and then correct
      // itself visibly.
      (function () {
        var search = window.location.search
        if (search.charAt(1) !== '/') return
        var restored = search.slice(1).split('&').map(function (part) {
          return part.replace(/~and~/g, '&')
        }).join('?')
        window.history.replaceState(
          null,
          '',
          window.location.pathname.slice(0, -1) + restored + window.location.hash,
        )
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- The only difference from index.html: the demo entry installs the frozen clock before
         main.tsx's first import runs. -->
    <script type="module" src="/src/demo/entry.tsx"></script>
  </body>
</html>
