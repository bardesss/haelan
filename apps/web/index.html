<!doctype html>
<!-- No data-theme: the stylesheet follows the reader's system and dark is its fallback.
     Pinning one here is how the light theme stayed unreachable. Set data-theme="dark" or
     "light" to force one; a toggle that writes this attribute is M3's. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hælan</title>
    <!-- The svg carries its own prefers-color-scheme rule, so one file covers both themes and
         stays sharp at every size a browser asks for. The ico is the fallback for anything that
         will not take an svg icon, and holds 16/32/48 with alpha. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="48x48 32x32 16x16" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- No service worker: this app cannot do anything without its server, so an offline promise
         would be a lie. Installability alone still earns its place - it reclaims the browser
         chrome a phone viewport otherwise loses to it. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0A0E17" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F5F7FB" media="(prefers-color-scheme: light)" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
